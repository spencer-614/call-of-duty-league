<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="pointerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#d5f45b" flood-opacity="0.95"/>
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="casingGradPointer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8892d"/>
      <stop offset="35%" stop-color="#fae08f"/>
      <stop offset="65%" stop-color="#fff8d6"/>
      <stop offset="100%" stop-color="#8a6f1f"/>
    </linearGradient>
    <linearGradient id="bulletGradPointer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8531c"/>
      <stop offset="40%" stop-color="#f59445"/>
      <stop offset="70%" stop-color="#ffd2a4"/>
      <stop offset="100%" stop-color="#823c0c"/>
    </linearGradient>
    <linearGradient id="activeLimeTip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4f035"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8e82a"/>
    </linearGradient>
  </defs>

  <!-- Tactical Reticle Pulse Ring at Tip (2, 2) -->
  <circle cx="2" cy="2" r="2.5" fill="none" stroke="#d5f45b" stroke-width="0.8" opacity="0.85"/>

  <g transform="translate(2, 2) rotate(-45)" filter="url(#pointerGlow)">
    <!-- Casing Base / Rim -->
    <path d="M-4.2 24 L4.2 24 L4.2 26 L-4.2 26 Z" fill="#7a621a" stroke="#11120f" stroke-width="0.8"/>
    <!-- Extractor Groove -->
    <path d="M-3.4 22.5 L3.4 22.5 L3.4 24 L-3.4 24 Z" fill="#52410f" stroke="#11120f" stroke-width="0.6"/>
    <!-- Casing Main Body -->
    <path d="M-4 11 L-3.2 9.5 L-3.2 8.5 L3.2 8.5 L3.2 9.5 L4 11 L4 22.5 L-4 22.5 Z" fill="url(#casingGradPointer)" stroke="#11120f" stroke-width="0.8"/>
    <!-- Casing Specular Glint -->
    <line x1="1" y1="11.5" x2="1" y2="22" stroke="#ffffff" stroke-width="0.9" opacity="0.8"/>
    <!-- Projectile Head -->
    <path d="M-3.2 8.5 C-3.2 5 -1.8 1.8 0 0 C1.8 1.8 3.2 5 3.2 8.5 Z" fill="url(#bulletGradPointer)" stroke="#11120f" stroke-width="0.8"/>
    <!-- Active Illuminated Electric Lime Tip -->
    <path d="M-2 3.2 C-1 1 -0.2 0.2 0 0 C0.2 0.2 1 1 2 3.2 C1 3.8 -1 3.8 -2 3.2 Z" fill="url(#activeLimeTip)" stroke="#d5f45b" stroke-width="0.5"/>
    <!-- Specular Highlight -->
    <line x1="0.8" y1="2" x2="0.8" y2="8" stroke="#ffffff" stroke-width="0.7" opacity="0.75"/>
  </g>
</svg>
