<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="bulletShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#917424"/>
      <stop offset="35%" stop-color="#f5d47a"/>
      <stop offset="65%" stop-color="#fff0b8"/>
      <stop offset="100%" stop-color="#7a5f18"/>
    </linearGradient>
    <linearGradient id="bulletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#914818"/>
      <stop offset="40%" stop-color="#e2873c"/>
      <stop offset="70%" stop-color="#f8be82"/>
      <stop offset="100%" stop-color="#70320a"/>
    </linearGradient>
    <linearGradient id="greenTipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7da01a"/>
      <stop offset="50%" stop-color="#d5f45b"/>
      <stop offset="100%" stop-color="#607c0f"/>
    </linearGradient>
  </defs>
  <g transform="translate(2, 2) rotate(-45)" filter="url(#bulletShadow)">
    <!-- Casing Base / Rim -->
    <path d="M-4.2 24 L4.2 24 L4.2 26 L-4.2 26 Z" fill="#665014" stroke="#11120f" stroke-width="0.8"/>
    <!-- Extractor Groove -->
    <path d="M-3.4 22.5 L3.4 22.5 L3.4 24 L-3.4 24 Z" fill="#44350c" stroke="#11120f" stroke-width="0.6"/>
    <!-- Casing Main Body -->
    <path d="M-4 11 L-3.2 9.5 L-3.2 8.5 L3.2 8.5 L3.2 9.5 L4 11 L4 22.5 L-4 22.5 Z" fill="url(#casingGrad)" stroke="#11120f" stroke-width="0.8"/>
    <!-- Casing Specular Glint -->
    <line x1="1" y1="11.5" x2="1" y2="22" stroke="#ffffff" stroke-width="0.75" opacity="0.65"/>
    <!-- Projectile Head / FMJ Jacket -->
    <path d="M-3.2 8.5 C-3.2 5 -1.8 1.8 0 0 C1.8 1.8 3.2 5 3.2 8.5 Z" fill="url(#bulletGrad)" stroke="#11120f" stroke-width="0.8"/>
    <!-- M855 Green / Lime Penetrator Tip -->
    <path d="M-1.8 3 C-0.9 1 -0.2 0.2 0 0 C0.2 0.2 0.9 1 1.8 3 C0.8 3.6 -0.8 3.6 -1.8 3 Z" fill="url(#greenTipGrad)"/>
    <!-- Bullet Head Specular Glint -->
    <line x1="0.8" y1="2" x2="0.8" y2="8" stroke="#ffffff" stroke-width="0.6" opacity="0.55"/>
  </g>
</svg>
